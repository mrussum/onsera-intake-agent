name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Python linting (ruff)
  # No API keys required.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.7.1

      - name: Lint backend
        run: ruff check backend/ test_pipeline.py --config pyproject.toml

  # ---------------------------------------------------------------------------
  # Job 2: Backend unit tests (pure Python, no LLM calls)
  # No API keys required — tests only exercise deterministic Python logic.
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run unit tests
        working-directory: backend
        run: pytest tests/ -v

  # ---------------------------------------------------------------------------
  # Job 3: Build backend Docker image
  # Validates the Dockerfile builds cleanly. No API keys required.
  # ---------------------------------------------------------------------------
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t onsera-backend:ci -f backend/Dockerfile ./backend

  # ---------------------------------------------------------------------------
  # Job 4: Build frontend
  # Runs npm install + vite build to catch import/bundling errors.
  # No API keys required.
  # ---------------------------------------------------------------------------
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # ---------------------------------------------------------------------------
  # Job 5: Integration tests (full pipeline with real LLM calls)
  # Requires ANTHROPIC_API_KEY and GROQ_API_KEY repository secrets.
  # Only runs on pushes (not PRs from forks — secrets are unavailable there).
  # ---------------------------------------------------------------------------
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run integration tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python test_pipeline.py
