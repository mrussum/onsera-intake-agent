# Onsera Health — Production Nginx Configuration
#
# Architecture:
#   Browser → Nginx (443/80) → [/intake, /dashboard, /health] → backend:8000
#                            → [everything else]              → static SPA files
#
# TLS:
#   Certificates are expected at:
#     /etc/nginx/certs/fullchain.pem
#     /etc/nginx/certs/privkey.pem
#   Mount your cert volume into the nginx container at /etc/nginx/certs/.
#   For Let's Encrypt, use certbot or acme.sh before starting the stack.

# ── Rate limiting zones ──────────────────────────────────────────────────────
# Burst limits protect against credential stuffing and runaway clients.
# The intake endpoint is rate-limited more aggressively (audio uploads are heavy).

limit_req_zone $binary_remote_addr zone=api_general:10m  rate=60r/m;
limit_req_zone $binary_remote_addr zone=api_intake:10m   rate=10r/m;

# ── Upstream ─────────────────────────────────────────────────────────────────
upstream backend {
    server backend:8000;
    keepalive 16;
}

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS server ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Modern TLS configuration (Mozilla Intermediate)
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # OCSP stapling
    ssl_stapling            on;
    ssl_stapling_verify     on;
    resolver                8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout        5s;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header X-Frame-Options           "DENY"                                         always;
    add_header X-XSS-Protection          "1; mode=block"                                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy        "camera=(), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; media-src 'self' blob:; frame-ancestors 'none';" always;

    # ── Request size limit (50 MB audio uploads) ──────────────────────────────
    client_max_body_size 52m;

    # ── API endpoints — proxy to FastAPI backend ──────────────────────────────
    location ~ ^/(intake|dashboard|health)(/|$) {
        limit_req zone=api_general burst=20 nodelay;

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Generous timeout for long-running LLM pipeline calls (~60s)
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
    }

    # Tighter rate limit on audio file uploads
    location = /intake {
        limit_req zone=api_intake burst=5 nodelay;

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }

    # ── Frontend static files ─────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # React SPA — serve index.html for all client-side routes
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively (Vite adds content-hash to filenames)
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── Deny hidden files ─────────────────────────────────────────────────────
    location ~ /\. {
        deny all;
    }
}
